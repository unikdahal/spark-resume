# Minimal single-master/single-worker Celeborn config for spark-resume-celeborn's own local
# integration testing. Not tuned for anything beyond "runs on one machine, a handful of
# metadata-only shuffle registrations" -- this module never pushes real shuffle bytes through it
# (see CelebornExchangeStore's doc comment for why: this store is a metadata client only).

celeborn.metrics.enabled                 false

celeborn.master.host                     localhost
celeborn.master.port                     9097
celeborn.master.endpoints                localhost:9097

# The admin REST API CelebornExchangeStore actually talks to -- distinct from the RPC port above.
celeborn.master.http.host                localhost
celeborn.master.http.port                9098

celeborn.worker.storage.dirs             __WORKER_DATA_DIR__
celeborn.worker.monitor.disk.enabled     false
